name: Node.js CI

on:
  push:
    branches:
      - main
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'
      - name: Install Dependencies
        run: npm ci
      - name: Ensure webpack & webpack-cli installed
        run: |
          npm ls webpack || npm install --save-dev webpack
          npm ls webpack-cli || npm install --save-dev webpack-cli
      - name: Run Tests
        run: npm test
      - name: Run Build
        run: npm run build
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Show Encouraging Message
        run: |
          echo "🎉 الحلول رائعة! إذا كنت تتطلع إلى مغامرات جديدة، فكن شجاعًا واستمر في التعلم! 🚀"