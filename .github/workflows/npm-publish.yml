name: Publish Node.js Package

on:
  release:
    types: [created]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build # احذفها إذا مشروعك لا يحتاج build

  publish-npm:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build # احذفها إذا مشروعك لا يحتاج build

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}

  sponsorship:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Sponsors
        run: echo "🚀 إذا أعجبك المشروع يمكنك دعمنا عبر GitHub Sponsors: https://github.com/sponsors/ZOOKA-AI"