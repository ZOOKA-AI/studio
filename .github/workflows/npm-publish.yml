name: Node.js CI

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16' # هنا يمكنك تحديد إصدار Node.js المطلوب

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Show Encouraging Message
        run: |
          echo "🎉 الحلول رائعة! إذا كنت تتطلع إلى مغامرات جديدة، فكن شجاعًا واستمر في التعلم! 🚀"
