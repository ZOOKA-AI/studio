---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Ensure we have the full git history for proper ref resolution
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "github-actions[bot]@users.noreply.github.com"

      - name: Validate platform
        run: |
          # Dynamic platform validation without redundant checks
          bash .github/scripts/validate-platform.sh

      - name: Setup Node.js and npm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Enable caching to improve performance
          # and reduce npm registry load
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

      - name: Run linter
        run: npm run lint

      - name: Build project
        run: npm run build
        env:
          # Optimize build to respect rate limits
          NODE_OPTIONS: '--max-old-space-size=2048'
